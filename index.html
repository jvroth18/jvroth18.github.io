<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jordan Rothstein</title>
  <meta name="description" content="Jordan Rothstein — co-founder & agentic engineer, building AI that delivers. A living front page over Astoria: real weather, a biplane, and the work on the rooftops.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- share card — swap og:image/og:url for absolute URLs once the site has a domain -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jordan Rothstein — The Evening Post">
  <meta property="og:description" content="Co-founder & agentic engineer, building AI that delivers. A living front page over Astoria with real weather and a biplane.">
  <meta property="og:url" content="https://jvroth18.github.io/">
  <meta property="og:image" content="https://jvroth18.github.io/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jordan Rothstein — The Evening Post">
  <meta name="twitter:description" content="Co-founder & agentic engineer, building AI that delivers. A living front page over Astoria with real weather and a biplane.">
  <meta name="twitter:image" content="https://jvroth18.github.io/og.png">
</head>
<body>

  <!-- the sky: full-viewport live weather -->
  <canvas id="weather" aria-hidden="true"></canvas>
  <!-- the biplane: flies in the sky, in front of it, behind the skyline & panels -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- ===== masthead, printed on the sky ===== -->
  <header class="masthead">
    <h1 class="masthead-name reveal">Jordan Rothstein</h1>
    <div class="mast-rule reveal" aria-hidden="true"></div>
    <p class="dateline mono reveal"><span id="folio-date">…</span> · <span id="mast-wx">…</span> · <span id="edition">the evening post</span></p>
    <p class="standfirst reveal">Co-founder &amp; agentic engineer — building AI that delivers.</p>
    <p class="skyline-hint mono reveal">click a rooftop · or press <kbd>⌘K</kbd></p>
  </header>

  <!-- ===== the skyline: content as geography ===== -->
  <div class="skyline" id="skyline" aria-label="Astoria rooftops — the site's navigation">
    <svg viewBox="0 0 1440 380" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <!-- back layer: distant blocks -->
      <g class="far">
        <rect x="-20" y="150" width="180" height="240"/>
        <rect x="200" y="120" width="120" height="270"/>
        <rect x="440" y="140" width="150" height="250"/>
        <rect x="700" y="110" width="110" height="280"/>
        <rect x="940" y="150" width="170" height="240"/>
        <rect x="1200" y="125" width="130" height="265"/>
        <rect x="1370" y="155" width="90" height="235"/>
      </g>

      <!-- near layer: the acting buildings -->
      <g class="near">
        <!-- b1: Relay billboard -->
        <g class="spot" data-open="project-0" tabindex="0" role="button" aria-label="Relay — agentic computer use">
          <rect class="bldg" x="30" y="215" width="190" height="165"/>
          <rect class="bldg" x="192" y="198" width="16" height="17"/>
          <g class="win" data-b="1"></g>
          <g class="bb">
            <line x1="70" y1="215" x2="70" y2="185"/>
            <line x1="180" y1="215" x2="180" y2="185"/>
            <rect class="board" x="42" y="128" width="166" height="60"/>
            <circle class="lamp" cx="76" cy="122" r="4"/>
            <circle class="lamp" cx="125" cy="118" r="4"/>
            <circle class="lamp" cx="174" cy="122" r="4"/>
            <text class="board-label" x="125" y="156">RELAY</text>
            <text class="board-sub" x="125" y="174">agentic computer use</text>
          </g>
        </g>

        <!-- b2: Talky billboard (tallest) -->
        <g class="spot" data-open="project-1" tabindex="0" role="button" aria-label="Talky Voice AI — the AI front desk">
          <rect class="bldg" x="260" y="112" width="200" height="268"/>
          <g class="win" data-b="2"></g>
          <line x1="444" y1="112" x2="444" y2="72"/>
          <circle class="lamp" cx="444" cy="69" r="3.4"/>
          <g class="bb">
            <line x1="300" y1="112" x2="300" y2="100"/>
            <line x1="420" y1="112" x2="420" y2="100"/>
            <rect class="board" x="276" y="42" width="168" height="60"/>
            <circle class="lamp" cx="308" cy="36" r="4"/>
            <circle class="lamp" cx="360" cy="32" r="4"/>
            <circle class="lamp" cx="412" cy="36" r="4"/>
            <text class="board-label" x="360" y="70">TALKY</text>
            <text class="board-sub" x="360" y="88">the AI front desk</text>
          </g>
        </g>

        <!-- water tower: DISPATCHES (writing) -->
        <g class="spot" data-open="writing" tabindex="0" role="button" aria-label="Dispatches — essays">
          <rect class="bldg" x="520" y="168" width="230" height="212"/>
          <g class="win" data-b="3"></g>
          <rect class="bldg" x="702" y="156" width="22" height="12"/>
          <g class="tower">
            <line x1="580" y1="168" x2="572" y2="112"/>
            <line x1="690" y1="168" x2="698" y2="112"/>
            <line x1="600" y1="168" x2="600" y2="120"/>
            <line x1="670" y1="168" x2="670" y2="120"/>
            <path class="tank" d="M 566 112 L 704 112 L 692 56 L 578 56 Z"/>
            <path class="tank-roof" d="M 570 56 L 700 56 L 635 26 Z"/>
            <line x1="635" y1="26" x2="635" y2="12"/>
            <text class="tank-label" x="635" y="92">DISPATCHES</text>
          </g>
        </g>

        <!-- b4: Momentum billboard -->
        <g class="spot" data-open="project-2" tabindex="0" role="button" aria-label="Momentum Surface — quant research">
          <rect class="bldg" x="800" y="152" width="185" height="228"/>
          <g class="win" data-b="4"></g>
          <rect class="bldg" x="948" y="140" width="20" height="12"/>
          <g class="bb">
            <line x1="835" y1="152" x2="835" y2="140"/>
            <line x1="950" y1="152" x2="950" y2="140"/>
            <rect class="board" x="801" y="82" width="184" height="60"/>
            <circle class="lamp" cx="843" cy="76" r="4"/>
            <circle class="lamp" cx="893" cy="72" r="4"/>
            <circle class="lamp" cx="943" cy="76" r="4"/>
            <text class="board-label" x="893" y="109" style="font-size:22px">MOMENTUM</text>
            <text class="board-sub" x="893" y="128">path-signature research</text>
          </g>
        </g>

        <!-- b5: tracker billboard -->
        <g class="spot" data-open="project-3" tabindex="0" role="button" aria-label="tracker — open-source CLI">
          <rect class="bldg" x="1030" y="225" width="170" height="155"/>
          <g class="win" data-b="5"></g>
          <g class="bb">
            <line x1="1065" y1="225" x2="1065" y2="196"/>
            <line x1="1165" y1="225" x2="1165" y2="196"/>
            <rect class="board" x="1037" y="138" width="156" height="60"/>
            <circle class="lamp" cx="1070" cy="132" r="4"/>
            <circle class="lamp" cx="1115" cy="128" r="4"/>
            <circle class="lamp" cx="1160" cy="132" r="4"/>
            <text class="board-label" x="1115" y="166">TRACKER</text>
            <text class="board-sub" x="1115" y="184">open source</text>
          </g>
        </g>

        <!-- newsstand: THE POST (contact) -->
        <g class="spot" data-open="contact" tabindex="0" role="button" aria-label="The Post — contact Jordan">
          <rect class="bldg" x="1240" y="250" width="180" height="130"/>
          <g class="win" data-b="6"></g>
          <g class="stand">
            <rect class="kiosk" x="1284" y="196" width="92" height="54"/>
            <path class="awning" d="M 1276 196 L 1384 196 L 1376 178 L 1284 178 Z"/>
            <line x1="1404" y1="250" x2="1404" y2="212"/>
            <path class="flag" d="M 1404 212 L 1428 219 L 1404 226 Z"/>
            <text class="stand-label" x="1330" y="230">THE POST</text>
          </g>
        </g>
      </g>

      <!-- the street: grounds the whole composition -->
      <rect class="street" x="0" y="354" width="1440" height="26"/>
    </svg>
  </div>

  <!-- ===== the clipping: content panel, newspaper-styled ===== -->
  <div class="clipping-layer" id="clipping-layer" hidden>
    <div class="clipping" role="dialog" aria-modal="false" aria-labelledby="clip-title">
      <button class="clip-close mono" id="clip-close" aria-label="Close">✕ close</button>
      <div class="clip-body" id="clip-body"></div>
    </div>
  </div>

  <!-- command palette (the index — escape hatch) -->
  <div class="palette-layer" id="palette-layer" hidden>
    <div class="palette-backdrop" id="palette-backdrop"></div>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Index">
      <form id="palette-form" autocomplete="off">
        <div class="palette-input-row">
          <span class="palette-prompt">›</span>
          <input id="palette-input" class="mono" type="text" spellcheck="false" autocomplete="off"
                 placeholder="The index — where to?" aria-label="Search">
        </div>
      </form>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
      <div class="palette-foot mono">
        <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="hud" class="mono" hidden></div>

  <footer class="colophon mono">
    <span id="sb-wx">…</span>&nbsp;·&nbsp;<span id="sb-clock"></span>&nbsp;·&nbsp;©&nbsp;<span id="year"></span>&nbsp;jordan rothstein
  </footer>

  <script src="script.js"></script>
</body>
</html>
