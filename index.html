<body>

  <!-- the sky: full-viewport live weather -->
  <canvas id="weather" aria-hidden="true"></canvas>
  <!-- the biplane: flies in the sky, in front of it, behind the skyline & panels -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- ===== masthead, printed on the sky ===== -->
  <header class="masthead">
    <h1 class="masthead-name reveal">Jordan Rothstein</h1>
    <div class="mast-rule reveal" aria-hidden="true"></div>
    <p class="dateline mono reveal"><span id="folio-date">…</span> · <span id="mast-wx">…</span> · <span id="edition">the evening post</span></p>
    <p class="standfirst reveal">Co-founder &amp; agentic engineer — building AI that delivers.</p>
    <p class="skyline-hint mono reveal" id="hint-line" role="button" tabindex="0" aria-label="Open the index">
      <span class="hint-desktop">click a rooftop · <kbd>←</kbd><kbd>→</kbd> drive the street · or press <kbd>⌘K</kbd></span>
      <span class="hint-mobile">tap a rooftop · tap the car to cruise · or tap here</span>
    </p>
  </header>

  <!-- ===== the clipping: content panel, newspaper-styled ===== -->
  <div class="clipping-layer" id="clipping-layer" hidden>
    <div class="clipping" role="dialog" aria-modal="false" aria-labelledby="clip-title">
      <button class="clip-close mono" id="clip-close" aria-label="Close">✕ close</button>
      <div class="clip-body" id="clip-body"></div>
    </div>
  </div>

  <!-- command palette (the index — escape hatch) -->
  <div class="palette-layer" id="palette-layer" hidden>
    <div class="palette-backdrop" id="palette-backdrop"></div>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Index">
      <form id="palette-form" autocomplete="off">
        <div class="palette-input-row">
          <span class="palette-prompt">›</span>
          <input id="palette-input" class="mono" type="text" spellcheck="false" autocomplete="off"
                 placeholder="The index — where to?" aria-label="Search">
        </div>
      </form>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
      <div class="palette-foot mono">
        <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <footer class="colophon mono">
