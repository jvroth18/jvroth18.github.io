    <path d="M 14.5 23.5 L 14.5 13.5 L 21.5 23.5 Z" fill="#c05621"/>
    <path d="M 14.5 22 L 35 21.4 Q 43.5 21.4 43.5 24.9 Q 43.5 28.4 35 28.2 L 14.5 27.6 Q 13.2 24.8 14.5 22 Z" fill="#c05621"/>
