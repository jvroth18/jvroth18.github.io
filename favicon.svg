    <rect x="23.5" y="29.4" width="17.5" height="3" rx="1.5" fill="#16130f"/>
    <rect x="26.9" y="15.6" width="1.1" height="14.2" fill="#16130f"/>
    <rect x="36.4" y="15.6" width="1.1" height="14.2" fill="#16130f"/>
    <rect x="45.2" y="17.6" width="1.8" height="14.6" rx="0.9" fill="#16130f" opacity=".45"/>
    <circle cx="44.2" cy="25" r="1.7" fill="#16130f"/>
  </g>
