<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Evening Post — biplane over the rooftops -->
  <rect width="64" height="64" rx="13" fill="#f6ecda"/>

  <!-- skyline -->
  <rect x="5"  y="45" width="11" height="13" fill="#16130f"/>
  <rect x="19" y="39" width="13" height="19" fill="#16130f"/>
  <rect x="35" y="47" width="10" height="11" fill="#16130f"/>
  <rect x="48" y="42" width="12" height="16" fill="#16130f"/>
  <rect x="0"  y="55" width="64" height="9" fill="#16130f"/>

  <!-- lit windows -->
  <rect x="22" y="43" width="3" height="3.6" fill="#f2b558"/>
  <rect x="27.5" y="43" width="3" height="3.6" fill="#f2b558"/>
  <rect x="22" y="49" width="3" height="3.6" fill="#f2b558"/>
  <rect x="51" y="45" width="3" height="3.6" fill="#f2b558"/>
  <rect x="8"  y="48" width="3" height="3.6" fill="#f2b558"/>

